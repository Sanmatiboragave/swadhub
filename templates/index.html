<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Ticket Triage - UI</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; margin: 24px; }
      button { padding: 8px 12px; margin-right: 8px; }
      pre { background: #f6f8fa; padding: 12px; border-radius: 6px; max-height: 480px; overflow:auto }
      .status { margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>Ticket Triage — Browser UI</h1>
    <p>
      Run the classification pipeline and view results in your browser.
    </p>

    <div>
      <button id="run">Run Classification</button>
      <button id="refresh">Refresh Results</button>
      <span id="msg"></span>
    </div>

    <div class="status">
      <h2>Results</h2>
      <pre id="output">(no results yet)</pre>
    </div>

    <script>
      const runBtn = document.getElementById('run');
      const refreshBtn = document.getElementById('refresh');
      const msg = document.getElementById('msg');
      const output = document.getElementById('output');

      runBtn.addEventListener('click', async () => {
        msg.textContent = 'Starting...';
        const res = await fetch('/run', { method: 'POST' });
        const j = await res.json();
        msg.textContent = j.status || JSON.stringify(j);
        // poll for results
        setTimeout(() => refreshResults(), 1000);
      });

      refreshBtn.addEventListener('click', () => refreshResults());

      async function refreshResults() {
        try {
          const r = await fetch('/results');
          if (!r.ok) throw new Error('no results');
          const data = await r.json();
          output.textContent = JSON.stringify(data, null, 2);
          msg.textContent = 'Loaded results.';
        } catch (e) {
          output.textContent = '(no results yet)';
          msg.textContent = 'No results available.';
        }
      }
    </script>
  </body>
</html>
