services:
  - type: web
    name: swadhub-api
    runtime: python
    pythonVersion: 3.11
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PORT
        value: 8000
    healthCheckPath: /
    envVarGroups:
      - name: production
        envVars:
          - key: ANTHROPIC_API_KEY
            sync: false
