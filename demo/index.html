<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Food Order Demo</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Foodie — Order Food</h1>
    <div class="search">
      <input id="search" placeholder="Search dishes or restaurants..." />
    </div>
    <div style="margin-left:16px">
      <button id="loginBtn" class="btn secondary">Login</button>
      <button id="accountBtn" class="btn secondary" style="margin-left:8px;display:none">Account</button>
      <span id="userLabel" style="margin-left:8px"></span>
    </div>
  </header>

  <main class="layout">
    <section class="menu">
      <div class="restaurant">
        <h2 id="restaurant-name">Pitta Palace</h2>
        <p class="meta">Open • 30–40 mins • 4.5★</p>
      </div>

      <div id="menu-list" class="items"></div>
    </section>

    <aside class="cart">
      <h3>Your Cart</h3>
      <div id="cart-items" class="cart-items">(empty)</div>
      <div class="cart-summary">
        <div>Subtotal: <span id="subtotal">$0.00</span></div>
        <button id="checkout" class="btn primary" disabled>Place Order</button>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script src="./app.js"></script>
</body>
</html>
